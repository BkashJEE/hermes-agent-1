name: bot-forge
repo: https://github.com/BkashJEE/hermes-bot-forge
sha: 4b6f7cfe6d78a3a82ea0fd96f98300f920a71b7f
description: "Say \"make me a <role>\" and your agent spawns a complete Bot Mode Bot — name, face, SOUL.md, memory, tools, skills, routines, gateway — tested, with rollback. Then hire a whole crew in one call, ask what is waiting on you, and edit, teach, share and health-check Bots by chatting. Disclosure — spawns the hermes CLI to create and run Bot profiles under HERMES_HOME/profiles/, and installs its own small companion hook plugin (bot-forge-marks, two hooks, no tools) into each Bot profile it manages, enabling it in that profile's config.yaml; never the root profile. Disclosure — when a Bot journals a blocked/failed entry, the plugin emails its title and summary to your own address via the SMTP account in Hermes' EMAIL_* settings (TLS verified; off with notify_blocked or notify_email false); adopt_bots (off by default) installs the companion hook into every profile on load. Disclosure — share_agent's optional publish argument posts the Bot template (never chats or credentials, secret-scanned first) as an unlisted gist by shelling out to the user's own signed-in gh CLI, and import_agent reads a template back over https only; both are off unless asked for, and the plugin never fetches or replaces its own files."
maintainer: BkashJEE
tier: community
category: automation
requires_hermes: ">=0.21"
