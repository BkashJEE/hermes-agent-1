description: Say "make me a <role>" and your agent builds that Bot — name, face, SOUL.md, memory, tools, skills, routines, Bot Chat — tested, with rollback, and it already knows which repo its work lives in. Bots acknowledge what you asked with a reaction, keep a factual journal, email you when blocked, and can take their own screen on a Linux gateway so you watch and take over at a login. Hire a crew, then manage them by chatting.
