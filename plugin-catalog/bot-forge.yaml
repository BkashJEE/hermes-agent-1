name: bot-forge
repo: https://github.com/BkashJEE/hermes-bot-forge
sha: def7b7d70b6acad1c70bd2098676e3bb5c389200
description: Say "make me a <role>" and your agent spawns a complete Bot Mode Bot — name, face, SOUL.md, memory, tools, skills, routines, gateway — tested, with rollback. Then hire a whole crew in one call, ask what is waiting on you, and edit, teach, share and health-check Bots by chatting. Disclosure — spawns the hermes CLI to create and run Bot profiles under HERMES_HOME/profiles/, and installs its own small companion hook plugin (bot-forge-marks, two hooks, no tools) into each Bot profile it manages, enabling it in that profile's config.yaml; never the root profile.
maintainer: BkashJEE
tier: community
category: automation
requires_hermes: ">=0.21"
