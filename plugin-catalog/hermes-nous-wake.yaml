title: "Nous Wake"
description: "The Nous girl wakes up every time you start a new Hermes chat: a three-second moment inside the chat window where an old CRT switches on, she opens her eyes in five steps in the black-and-white Nous manga ink style, and the tube switches off into your chat. Choose every new chat, the first chat of the day, app launch only, or off (Settings > Plugins > Nous Wake); replay it from the status-bar eye or the command palette. A click or any key skips it; reduced motion gets a calm fade. Desktop only: no tools, no network, no model calls. Disclosure — reads the chat window's position through the documented [data-chat-surface] attribute from its own composer slot to draw over that window only; the artwork is derived from the official Nous girl art in hermes-agent (MIT)."
