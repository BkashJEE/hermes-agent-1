name: bot-forge-sentinel
version: "0.1.0"
description: "Decide what a profile's agent may actually do, outside the model. An agent's `ask first` rules normally live in its SOUL.md as prose that nothing checks; this turns them into pre_tool_call directives Hermes enforces — refusing what the policy refuses and routing the rest to the human approval gate. Matched on tool name by word parts, so `undelete_draft` is not a delete. Fails closed: an unreadable policy refuses rather than permits. Hooks only — grants the agent no tools."
author: "Bikash Joshi (hermes-bot-forge)"
license: MIT
provides_hooks:
  - pre_tool_call
config_schema:
  refuse:
    type: list
    default: []
    description: Tools this profile may never call, whatever is said in the moment.
  ask:
    type: list
    default: []
    description: Tools that always reach the human approval gate, even if the model does not think to ask.
  allow:
    type: list
    default: []
    description: >-
      Tools that are fine without asking, even when the name looks like one of the built-in
      categories. Use it to clear the one send or delete this profile's job actually needs.
  mode:
    type: str
    default: allow
    description: >-
      What happens to a tool in none of the lists — allow (default) or ask. Set ask for a
      profile that should be cleared tool by tool.
  guard_defaults:
    type: bool
    default: true
    description: >-
      Apply the three categories an agent's own approval wording usually names — send/post/publish,
      spend, delete — to tools not listed above. Off means only the explicit lists apply.
